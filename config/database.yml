default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

local: &local
  <<: *default
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5433) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "stockroom") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "stockroom") %>

development:
  <<: *local
  database: stockroom_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *local
  database: stockroom_test

production:
  primary: &primary_production
    <<: *default
    database: stockroom_production
    username: stockroom
    password: <%= ENV["STOCKROOM_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: stockroom_production_cache
    migrations_paths: db/cache_migrate
    schema_format: ruby
  queue:
    <<: *primary_production
    database: stockroom_production_queue
    migrations_paths: db/queue_migrate
    schema_format: ruby
  cable:
    <<: *primary_production
    database: stockroom_production_cable
    migrations_paths: db/cable_migrate
    schema_format: ruby
