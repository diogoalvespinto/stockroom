services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
